<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Study – Class 6–12</title>
  <meta name="theme-color" content="#0f766e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Smart Study" />
  <link
    id="appIconLink"
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='42' fill='%230f766e'/%3E%3Cpath fill='%23ffffff' d='M48 48h40c10 0 16 6 16 16v80c0-7-6-12-14-12H48V48zm96 0h-40c-10 0-16 6-16 16v80c0-7 6-12 14-12h42V48z'/%3E%3C/svg%3E"
  />
  <link
    id="appleIconLink"
    rel="apple-touch-icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='42' fill='%230f766e'/%3E%3Cpath fill='%23ffffff' d='M48 48h40c10 0 16 6 16 16v80c0-7-6-12-14-12H48V48zm96 0h-40c-10 0-16 6-16 16v80c0-7 6-12 14-12h42V48z'/%3E%3C/svg%3E"
  />
  <link id="manifestLink" rel="manifest" href="" />
  <script>
    (function setupManifest() {
      const iconSvg =
        "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='42' fill='%230f766e'/%3E%3Cpath fill='%23ffffff' d='M48 48h40c10 0 16 6 16 16v80c0-7-6-12-14-12H48V48zm96 0h-40c-10 0-16 6-16 16v80c0-7 6-12 14-12h42V48z'/%3E%3C/svg%3E";
      const manifest = {
        name: "Smart Study – Class 6–12",
        short_name: "Smart Study",
        start_url: "./",
        scope: "./",
        display: "standalone",
        background_color: "#f4f7f6",
        theme_color: "#0f766e",
        icons: [
          {
            src: iconSvg,
            sizes: "192x192",
            type: "image/svg+xml",
            purpose: "any"
          },
          {
            src: iconSvg,
            sizes: "512x512",
            type: "image/svg+xml",
            purpose: "any"
          }
        ]
      };
      const manifestHref =
        "data:application/manifest+json;charset=utf-8," +
        encodeURIComponent(JSON.stringify(manifest));
      const linkEl = document.getElementById("manifestLink");
      if (linkEl) linkEl.href = manifestHref;
    })();
  </script>
  <style>
    :root {
      --bg: #f4f7f6;
      --card: #ffffff;
      --primary: #0f766e;
      --primary-dark: #115e59;
      --primary-light: #ccfbf1;
      --accent: #f59e0b;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --danger: #dc2626;
      --success: #16a34a;
      --shadow: 0 6px 20px rgba(15, 23, 42, 0.06);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Bengali", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 84px;
    }

    .topbar {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      padding: 16px 16px 20px;
      border-bottom-left-radius: 22px;
      border-bottom-right-radius: 22px;
      box-shadow: var(--shadow);
    }

    .topbar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.2px;
      margin: 0;
    }

    .badge-pill {
      background: rgba(255, 255, 255, 0.18);
      color: #fff;
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }

    .name-input {
      margin-top: 12px;
      width: 100%;
      background: #fff;
      color: var(--text);
      border: none;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 15px;
      font-weight: 600;
      outline: none;
    }

    .chip-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-top: 12px;
      scrollbar-width: none;
    }

    .chip-strip::-webkit-scrollbar {
      display: none;
    }

    .chip-btn {
      flex: 0 0 auto;
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .chip-btn.active {
      background: #ffffff;
      color: var(--primary-dark);
      border-color: #ffffff;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.12);
    }

    .container {
      max-width: 780px;
      margin: 14px auto 0;
      padding: 0 14px;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      margin-bottom: 14px;
    }

    .section-title {
      margin: 0 0 6px;
      font-size: 18px;
      font-weight: 800;
    }

    .muted {
      color: var(--muted);
      font-size: 13px;
      margin: 0;
    }

    .progress-wrap {
      margin-top: 10px;
      background: #e2e8f0;
      height: 8px;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: var(--primary);
      border-radius: 999px;
      transition: width 0.25s ease;
    }

    .group-label {
      margin: 16px 0 8px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.6px;
      color: var(--primary-dark);
      text-transform: uppercase;
    }

    .item-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
      transition: transform 0.14s ease, border-color 0.14s ease;
    }

    .item-card:active {
      transform: scale(0.99);
    }

    .item-title {
      font-size: 15px;
      font-weight: 700;
      margin: 0 0 6px;
    }

    .tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--primary-light);
      color: var(--primary-dark);
      margin-right: 6px;
    }

    .tag.done {
      background: #dcfce7;
      color: #15803d;
    }

    .arrow-circle {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      background: var(--primary-light);
      color: var(--primary-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      flex-shrink: 0;
    }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-light {
      background: #f1f5f9;
      color: var(--text);
    }

    .btn-danger {
      background: #fee2e2;
      color: var(--danger);
    }

    .summary-hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: linear-gradient(135deg, #f0fdfa, #ccfbf1);
      padding: 14px;
      border-radius: 14px;
      margin-bottom: 14px;
    }

    .big-time {
      font-size: 26px;
      font-weight: 900;
      color: var(--primary-dark);
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 999px;
      background: var(--primary);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 17px;
      flex-shrink: 0;
    }

    .subject-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
    }

    .timer-display {
      text-align: center;
      font-size: 42px;
      font-weight: 900;
      color: var(--primary-dark);
      margin: 14px 0;
      font-variant-numeric: tabular-nums;
    }

    .field-input, .field-textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 14px;
      font-family: inherit;
      margin-bottom: 10px;
      background: #fff;
      color: var(--text);
    }

    .field-textarea {
      min-height: 110px;
      resize: vertical;
    }

    .reader-box {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      line-height: 1.7;
      font-size: 15px;
      margin: 12px 0;
      white-space: pre-line;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #ffffff;
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 6px 8px 10px;
      z-index: 20;
    }

    .nav-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      padding: 6px 4px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .nav-btn.active {
      background: var(--primary-light);
      color: var(--primary-dark);
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <h1 class="brand">Smart Study</h1>
      <span class="badge-pill" id="classGroupBadge">Class 10 · Science</span>
    </div>
    <input
      type="text"
      id="studentNameInput"
      class="name-input"
      placeholder="তোমার নাম লেখো..."
    />
    <div class="chip-strip" id="classChips"></div>
    <div class="chip-strip" id="groupChips"></div>
  </header>

  <main class="container" id="appView"></main>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-tab="books" onclick="switchTab('books')">
      <span>📚</span>
      <span>Books</span>
    </button>
    <button class="nav-btn" data-tab="subjects" onclick="switchTab('subjects')">
      <span>📊</span>
      <span>Subjects</span>
    </button>
    <button class="nav-btn" data-tab="timer" onclick="switchTab('timer')">
      <span>⏱️</span>
      <span>Timer</span>
    </button>
    <button class="nav-btn" data-tab="notes" onclick="switchTab('notes')">
      <span>📝</span>
      <span>Notes</span>
    </button>
  </nav>

  <script>
    const STORAGE_KEY = "smart_study_v2_data";

    const CLASSES = [6, 7, 8, 9, 10, 11, 12];
    const GROUPS = ["General", "Science", "Arts / Humanities", "Commerce"];

    const DEFAULT_DATA = {
      studentName: "Nahid Hossen",
      selectedClass: 10,
      selectedGroup: "Science",
      activeTab: "books",
      readerItem: null,
      completedIds: [],
      studySecondsBySubject: {
        "বাংলা": 3600,
        "English": 2700,
        "Higher Math": 5400,
        "Physics": 4200,
        "Biology": 2400,
        "ICT": 1800
      },
      notes: [
        { id: 1, subject: "Higher Math", text: "অধ্যায় ৮: ত্রিকোণমিতির সূত্রগুলো রিভিশন দিতে হবে।" },
        { id: 2, subject: "Physics", text: "গতি ও বলের গাণিতিক সমস্যাগুলো অনুশীলন করো।" }
      ]
    };

    let state = loadState();
    let timerInterval = null;
    let elapsedSeconds = 0;
    let isRunning = false;

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return structuredClone(DEFAULT_DATA);
        return { ...structuredClone(DEFAULT_DATA), ...JSON.parse(raw) };
      } catch {
        return structuredClone(DEFAULT_DATA);
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch {}
    }

    function getItemsForCurrentSelection() {
      const cls = state.selectedClass;
      const grp = state.selectedGroup;

      if (cls === 10) {
        return [
          {
            id: `10-${grp}-bangla-tb`, section: "GENERAL SUBJECTS", title: "বাংলা ১ম ও ২য় পত্র (SSC)", category: "Textbook", subject: "বাংলা", content: "SSC বাংলা ১ম ও ২য় পত্র মূল পাঠ্যবইয়ের সারসংক্ষেপ, গদ্য-পদ্যের মূলভাব এবং ব্যাকরণের গুরুত্বপূর্ণ নিয়মাবলি।" }, { id: `10-${grp}-bangla-gd`,
            section: "GENERAL SUBJECTS",
            title: "বাংলা SSC Lecture Guide",
            category: "Lecture Guide",
            subject: "বাংলা",
            content: "প্রতিটি অধ্যায়ের সৃজনশীল প্রশ্নোত্তর, বহুনির্বাচনি ব্যাখ্যা ও পরীক্ষার প্রস্তুতির দিকনির্দেশনা।"
          },
          {
            id: `10-${grp}-bangla-tp`, section: "GENERAL SUBJECTS", title: "বাংলা SSC Test Paper 2026", category: "SSC Test Paper", subject: "বাংলা", content: "শীর্ষস্থানীয় স্কুল ও বোর্ড পরীক্ষার মডেল প্রশ্নপত্র এবং উত্তর বিশ্লেষণ।" }, { id: `10-${grp}-bangla-sp`,
            section: "GENERAL SUBJECTS",
            title: "বাংলা CQ & MCQ Supplement",
            category: "CQ & MCQ Supplement",
            subject: "বাংলা",
            content: "দ্রুত রিভিশনের জন্য বাছাইকৃত CQ ও MCQ সাপ্লিমেন্ট নোট।"
          },
          {
            id: `10-${grp}-eng-tb`, section: "GENERAL SUBJECTS", title: "English for Today & Grammar", category: "Textbook", subject: "English", content: "Seen/Unseen passages, vocabulary highlights, and essential grammar rules for SSC candidates." }, { id: `10-${grp}-hmath-gd`,
            section: `${grp.toUpperCase()} SUBJECTS`, title: `${grp === "Science" ? "Higher Math" : "Core Subject"} Lecture Guide`,
            category: "Lecture Guide",
            subject: grp === "Science" ? "Higher Math" : "বাংলা",
            content: "ধাপে ধাপে সূত্রের প্রমাণ, উদাহরণ এবং বোর্ড উপযোগী অনুশীলনী সমাধান।"
          },
          {
            id: `10-${grp}-phy-sp`,
            section: `${grp.toUpperCase()} SUBJECTS`, title: `${grp === "Science" ? "Physics" : "Subject"} CQ & MCQ Supplement`,
            category: "CQ & MCQ Supplement",
            subject: grp === "Science" ? "Physics" : "English",
            content: "গুরুত্বপূর্ণ সূত্র, গাণিতিক সমস্যা ও সংক্ষিপ্ত প্রশ্নোত্তর সাপ্লিমেন্ট।"
          }
        ];
      }

      return [
        {
          id: `${cls}-${grp}-tb-1`,
          section: "TEXTBOOKS & GUIDES",
          title: `Class ${cls} (${grp}) Main Textbook`,
          category: "Textbook",
          subject: "বাংলা",
          content: `Class ${cls} (${grp}) এর মূল পাঠ্যবইয়ের অধ্যায়ভিত্তিক মূল বিষয়বস্তু ও সারসংক্ষেপ।`
        },
        {
          id: `${cls}-${grp}-gd-1`,
          section: "TEXTBOOKS & GUIDES",
          title: `Class ${cls} (${grp}) Study Guide`,
          category: "Lecture Guide",
          subject: "English",
          content: `Class ${cls} এর অধ্যায়ভিত্তিক নোট, প্রশ্নোত্তর ও অনুশীলনের সহজ গাইড।`
        }
      ];
    }

    function renderChips() {
      const classChipsEl = document.getElementById("classChips");
      const groupChipsEl = document.getElementById("groupChips");
      const badgeEl = document.getElementById("classGroupBadge");
      const nameEl = document.getElementById("studentNameInput");

      nameEl.value = state.studentName || "";
      badgeEl.textContent = `Class ${state.selectedClass} ·${state.selectedGroup}`;

      classChipsEl.innerHTML = CLASSES.map(c => `
        <button
          class="chip-btn ${state.selectedClass === c ? "active" : ""}"
          onclick="selectClass(${c})"
        >Class ${c}</button>
      `).join("");

      groupChipsEl.innerHTML = GROUPS.map(g => `
        <button
          class="chip-btn ${state.selectedGroup === g ? "active" : ""}"
          onclick="selectGroup('${g.replace(/'/g, "\\'")}')"
        >${g}</button>
      `).join("");
    }

    function selectClass(cls) {
      state.selectedClass = cls;
      state.readerItem = null;
      saveState();
      renderAll();
    }

    function selectGroup(grp) {
      state.selectedGroup = grp;
      state.readerItem = null;
      saveState();
      renderAll();
    }

    function switchTab(tab) {
      state.activeTab = tab;
      state.readerItem = null;
      saveState();
      document.querySelectorAll(".nav-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.tab === tab);
      });
      renderView();
    }

    function openItem(id) {
      const items = getItemsForCurrentSelection();
      const found = items.find(item => item.id === id);
      if (!found) return;
      state.readerItem = found;
      saveState();
      renderView();
    }

    function closeReader() {
      state.readerItem = null;
      saveState();
      renderView();
    }

    function toggleCompleted(id) {
      const idx = state.completedIds.indexOf(id);
      if (idx >= 0) {
        state.completedIds.splice(idx, 1);
      } else {
        state.completedIds.push(id);
      }
      saveState();
      renderView();
    }

    function formatDuration(totalSec) {
      const hrs = Math.floor(totalSec / 3600);
      const mins = Math.floor((totalSec % 3600) / 60);
      if (hrs > 0) return `${hrs}h${mins}m`;
      return `${mins}m`; }  function formatClock(sec) { const h = String(Math.floor(sec / 3600)).padStart(2, "0"); const m = String(Math.floor((sec \% 3600) / 60)).padStart(2, "0"); const s = String(sec \% 60).padStart(2, "0"); return `${h}:${m}:${s}`;
    }

    function renderBooksView(container) {
      if (state.readerItem) {
        const item = state.readerItem;
        const isDone = state.completedIds.includes(item.id);
        container.innerHTML = `
          <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:10px;">
              <button class="btn btn-light" onclick="closeReader()">← Back</button>
              <span class="tag">${item.category}</span>
            </div>
            <h2 class="section-title">${item.title}</h2>
            <p class="muted">Subject: ${item.subject} · Class ${state.selectedClass}</p>
            <div class="reader-box">${item.content}</div>
            <button class="btn ${isDone ? "btn-light" : "btn-primary"}" style="width:100\%;" onclick="toggleCompleted('${item.id}')">
              ${isDone ? "✓ Completed (Mark Incomplete)" : "Mark as Completed"}
            </button>
          </div>
        `;
        return;
      }

      const items = getItemsForCurrentSelection();
      const totalCount = state.selectedClass === 10 ? 27 : items.length;
      const doneCount = items.filter(i => state.completedIds.includes(i.id)).length;
      const pct = totalCount > 0 ? Math.min(100, Math.round((doneCount / totalCount) * 100)) : 0;

      const sections = [...new Set(items.map(i => i.section))];

      let html = `
        <div class="card">
          <h2 class="section-title">Class ${state.selectedClass} (${state.selectedGroup}) Books & Resources</h2>
          <p class="muted">Completed: ${doneCount} / ${totalCount} items (${pct}%)</p>
          <div class="progress-wrap">
            <div class="progress-bar" style="width:${pct}%;"></div>
          </div>
        </div>
      `;

      sections.forEach(sec => {
        html += `<div class="group-label">${sec}</div>`;
        items.filter(i => i.section === sec).forEach(item => {
          const done = state.completedIds.includes(item.id);
          html += `
            <div class="item-card" onclick="openItem('${item.id}')">
              <div>
                <p class="item-title">${item.title}</p>
                <span class="tag">${item.category}</span>${done ? `<span class="tag done">Completed</span>` : ""}
              </div>
              <div class="arrow-circle">→</div>
            </div>
          `;
        });
      });

      container.innerHTML = html;
    }

    function renderSubjectsView(container) {
      const entries = Object.entries(state.studySecondsBySubject);
      const totalSec = entries.reduce((sum, [, s]) => sum + s, 0);
      const initial = (state.studentName || "S").trim().charAt(0).toUpperCase();

      container.innerHTML = `
        <div class="card">
          <h2 class="section-title">Today’s Study Time</h2>
          <div class="summary-hero">
            <div>
              <div class="muted">Total Study Time</div>
              <div class="big-time">${formatDuration(totalSec)}</div>
            </div>
            <div style="display:flex; align-items:center; gap:10px;">
              <span style="font-weight:700;">${state.studentName || "Student"}</span>
              <div class="avatar">${initial}</div>
            </div>
          </div>
          ${entries.map(([subj, sec]) => `
            <div class="subject-row">
              <span>${subj}</span>
              <span>${formatDuration(sec)}</span>
            </div>
          `).join("")}
        </div>
      `;
    }

    function renderTimerView(container) {
      const subjects = Object.keys(state.studySecondsBySubject);
      container.innerHTML = `
        <div class="card">
          <h2 class="section-title">Study Timer</h2>
          <p class="muted">বিষয় বেছে নিয়ে পড়াশোনার সময় ট্র্যাক করো</p>
          <select id="timerSubjectSelect" class="field-input" style="margin-top:12px;">
            ${subjects.map(s => `<option value="${s}">${s}</option>`).join("")}
          </select>
          <div class="timer-display" id="timerClock">${formatClock(elapsedSeconds)}</div>
          <div style="display:flex; gap:10px;">
            <button class="btn btn-primary" style="flex:1;" onclick="toggleTimer()">
              ${isRunning ? "Pause" : "Start"}
            </button>
            <button class="btn btn-light" style="flex:1;" onclick="saveTimerSession()">
              Save Time
            </button>
            <button class="btn btn-danger" onclick="resetTimer()">Reset</button>
          </div>
        </div>
      `;
    }

    function toggleTimer() {
      if (isRunning) {
        clearInterval(timerInterval);
        timerInterval = null;
        isRunning = false;
      } else {
        isRunning = true;
        timerInterval = setInterval(() => {
          elapsedSeconds += 1;
          const el = document.getElementById("timerClock");
          if (el) el.textContent = formatClock(elapsedSeconds);
        }, 1000);
      }
      renderView();
    }

    function saveTimerSession() {
      const sel = document.getElementById("timerSubjectSelect");
      const subj = sel ? sel.value : "বাংলা";
      state.studySecondsBySubject[subj] = (state.studySecondsBySubject[subj] || 0) + elapsedSeconds;
      elapsedSeconds = 0;
      clearInterval(timerInterval);
      timerInterval = null;
      isRunning = false;
      saveState();
      renderView();
    }

    function resetTimer() {
      elapsedSeconds = 0;
      clearInterval(timerInterval);
      timerInterval = null;
      isRunning = false;
      renderView();
    }

    function renderNotesView(container) {
      container.innerHTML = `
        <div class="card">
          <h2 class="section-title">Quick Study Notes</h2>
          <input type="text" id="noteSubjectInput" class="field-input" placeholder="বিষয়ের নাম (যেমন: Higher Math, Physics)" />
          <textarea id="noteTextInput" class="field-textarea" placeholder="তোমার গুরুত্বপূর্ণ নোট বা রিভিশন পয়েন্ট লেখো..."></textarea>
          <button class="btn btn-primary" style="width:100%;" onclick="addNote()">Save Note</button>
        </div>
        ${state.notes.map(n => `
          <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
              <span class="tag">${n.subject || "General"}</span>
              <button class="btn btn-danger" style="padding:5px 10px; font-size:12px;" onclick="deleteNote(${n.id})">Delete</button>
            </div>
            <p style="margin:0; line-height:1.6;">${n.text}</p>
          </div>
        `).join("")}
      `;
    }

    function addNote() {
      const subjEl = document.getElementById("noteSubjectInput");
      const textEl = document.getElementById("noteTextInput");
      const text = (textEl?.value || "").trim();
      if (!text) return;
      state.notes.unshift({
        id: Date.now(),
        subject: (subjEl?.value || "").trim() || "General",
        text
      });
      saveState();
      renderView();
    }

    function deleteNote(id) {
      state.notes = state.notes.filter(n => n.id !== id);
      saveState();
      renderView();
    }

    function renderView() {
      const container = document.getElementById("appView");
      if (state.activeTab === "books") renderBooksView(container);
      else if (state.activeTab === "subjects") renderSubjectsView(container);
      else if (state.activeTab === "timer") renderTimerView(container);
      else if (state.activeTab === "notes") renderNotesView(container);
    }

    function renderAll() {
      renderChips();
      renderView();
    }

    document.getElementById("studentNameInput").addEventListener("input", (e) => {
      state.studentName = e.target.value;
      saveState();
    });

    renderAll();
  </script>
</body>
      </html>
