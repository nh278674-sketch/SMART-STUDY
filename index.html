  .subj-card small { color: #56645e; display: block; margin-top: 3px; }

  @media (min-width: 540px) { .mode-bar { grid-template-columns: repeat(4, 1fr); } }
  .mode-btn { border: 1px solid #cfe0da; background: #f5f9f7; color: #16201c; padding: 9px 10px; border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer; text-align: center; }

  .reader-box ul { padding-left: 18px; margin-bottom: 10px; }
  .page-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; gap: 8px; }

  .big-time { font-size: 30px; font-weight: 800; color: #0f6b53; margin: 6px 0 12px; }
  .list-item { display: flex; justify-content: space-between; align-items: center; padding: 11px 0; border-bottom: 1px solid #eef2f0; gap: 10px; }

  "Accounting": {

    ],

        body: "৫০,০০০ টাকা মূলধন নিয়ে ব্যবসা শুরু করা হলো এবং ১০,০০০ টাকার আসবাবপত্র নগদে ক্রয় করা হলো।",
        points: ["ক) মূলধন জাতীয় ব্যয় কাকে বলে?", "খ) হিসাব সমীকরণের ওপর উক্ত লেনদেনগুলোর প্রভাব দেখাও।"]

  },
  "History": {
    books: [
      {

        points: ["প্রাচীন জনপদসমূহের অবস্থান", "ঐতিহাসিক নিদর্শনের গুরুত্ব"]
      }
    ],
    guides: [
      {
        title: "গাইড: ভাষা আন্দোলন ও স্বাধিকার",
        body: "১৯৫২ সালের ২১শে ফেব্রুয়ারি মাতৃভাষা বাংলার মর্যাদা রক্ষার আন্দোলনে সালাম, বরকত, রফিক, জব্বারসহ অনেকে জীবন দেন। এটি বাঙালির জাতীয় চেতনা ও স্বাধিকার সংগ্রামের ভিত্তি তৈরি করে।",
        points: ["১৯৫২-এর ভাষা আন্দোলনের তাৎপর্য", "পরবর্তী গণতান্ত্রিক আন্দোলনের পটভূমি"]
      }
    ],
    supplements: [
      {
        title: "সাপ্লিমেন্ট: সাল ও গুরুত্বপূর্ণ তথ্য",
        body: "ইতিহাসের উত্তর লেখার সময় সঠিক সাল, স্থান ও ঘটনার ধারাবাহিকতা বজায় রাখলে নম্বর ভালো পাওয়া যায়।",
        points: ["২১শে ফেব্রুয়ারি: ভাষা শহীদ দিবস ও আন্তর্জাতিক মাতৃভাষা দিবস"]
      }
    ],
    testpapers: [
      {
        title: "টেস্ট পেপার সেট-০১: জনপদ ও ভাষা আন্দোলন",
        body: "মাতৃভাষার মর্যাদা রক্ষায় ত্যাগ ও আত্মত্যাগের ইতিহাস বাঙালিকে অধিকার আদায়ে অনুপ্রেরণা দেয়।",
        points: ["ক) প্রাচীন বাংলার একটি জনপদের নাম লেখো।", "খ) ১৯৫২ সালের ভাষা আন্দোলনের গুরুত্ব ব্যাখ্যা করো।"]
      }
    ]
  }
};

let state = {
  selectedClass: null,
  selectedGroup: null,
  selectedSubject: null,
  mode: "books",
  pageIdx: 0,
  tab: "study",
  times: {},
  runningSubject: null,
  timerSec: 0,
  notes: {}
};

let timerId = null;

function getSubjectsForSelection() {
  if (!state.selectedClass || !state.selectedGroup) return [];
  const base = state.selectedClass >= 9 ? CORE_9_12 : CORE_6_8;
  const extra = GROUP_MAP[state.selectedGroup] || [];
  return [...base, ...extra.filter(s => !base.includes(s))];
}

function getMaterialPages(subject, mode) {
  const custom = RICH_MATERIALS[subject] && RICH_MATERIALS[subject][mode];
  if (custom && custom.length) return custom;

  const modeNames = {
    books: "পাঠ্যবই (Book)",
    guides: "লেকচার গাইড (Guide)",
    supplements: "সাপ্লিমেন্ট নোট (Supplement)",
    testpapers: "টেস্ট পেপার (Test Paper)"
  };

  return [
    {
      title: `${subject} — ${modeNames[mode]} (অধ্যায় ১)`,
      body: `Class ${state.selectedClass} (${state.selectedGroup}) এর ${subject} বিষয়ের ${modeNames[mode]} অংশ। এখানে মূল ধারণা, সংজ্ঞা ও অনুশীলনের গুরুত্বপূর্ণ দিকগুলো গুছিয়ে দেওয়া হয়েছে।`,
      points: [
        `${subject}-এর মৌলিক বিষয়বস্তু ও সংজ্ঞা অনুশীলন`,
        `নিয়মিত নোট তৈরি করে মূল পয়েন্টগুলো ঝালিয়ে নেওয়া`
      ]
    },
    {
      title: `${subject} — ${modeNames[mode]} (অধ্যায় ২ ও অনুশীলন)`,
      body: `পরীক্ষার প্রস্তুতির জন্য ${subject}-এর গুরুত্বপূর্ণ প্রশ্ন, উদাহরণ ও অনুশীলনী নিয়মিত চর্চা করা প্রয়োজন। ডানদিকের 'Download PDF' বাটন চাপলে এই অংশের PDF ফাইল সেভ হবে।`,
      points: [
        `সংক্ষিপ্ত ও রচনামূলক প্রশ্নের কাঠামো অনুশীলন`,
        `ভুলগুলো চিহ্নিত করে পুনরায় রিভিশন দেওয়া`
      ]
    }
  ];
}

function formatSec(sec) {
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  if (h > 0) return `${h}h ${m}m ${s}s`;
  return `${m}m ${s}s`;
}

function downloadPDF(subject, mode, pages) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.setFontSize(15);
  doc.text(`Smart Study - ${subject} (${mode.toUpperCase()})`, 14, 18);
  doc.setFontSize(10);
  doc.text(`Class: ${state.selectedClass} | Group: ${state.selectedGroup} | Created by Nahid Hossen`, 14, 26);

  let y = 38;
  pages.forEach((item, idx) => {
    const safeTitle = item.title.replace(/[^\x20-\x7E\n]/g, "[Chapter]");
    const safeBody = item.body.replace(/[^\x20-\x7E\n]/g, "[Study content included in Smart Study]");
    const lines = doc.splitTextToSize(`${idx + 1}. ${safeTitle}\n${safeBody}`, 180);
    doc.text(lines, 14, y);
    y += lines.length * 6 + 10;
    if (y > 260) {
      doc.addPage();
      y = 20;
    }
  });

  doc.save(`SmartStudy_${subject.replace(/\s+/g, "_")}_${mode}.pdf`);
}

function selectClass(c) {
  state.selectedClass = c;
  state.selectedSubject = null;
  state.pageIdx = 0;
  render();
}

function selectGroup(g) {
  state.selectedGroup = g;
  state.selectedSubject = null;
  state.pageIdx = 0;
  render();
}

function selectSubject(subj) {
  state.selectedSubject = subj;
  state.pageIdx = 0;
  render();
}

function selectMode(m) {
  state.mode = m;
  state.pageIdx = 0;
  render();
}

function switchTab(t) {
  state.tab = t;
  document.querySelectorAll("nav.bottom button").forEach(b => b.classList.remove("active"));
  document.getElementById(`tab-${t}`).classList.add("active");
  render();
}

function toggleTimer(subj) {
  if (state.runningSubject === subj) {
    clearInterval(timerId);
    timerId = null;
    state.times[subj] = (state.times[subj] || 0) + state.timerSec;
    state.runningSubject = null;
    state.timerSec = 0;
  } else {
    if (state.runningSubject) {
      clearInterval(timerId);
      state.times[state.runningSubject] = (state.times[state.runningSubject] || 0) + state.timerSec;
    }
    state.runningSubject = subj;
    state.timerSec = 0;
    timerId = setInterval(() => {
      state.timerSec += 1;
      render();
    }, 1000);
  }
  render();
}

function saveNote(subj, val) {
  state.notes[subj] = val;
}

function renderHeaderBars() {
  document.getElementById("classBar").innerHTML = CLASSES.map(c =>
    `<button class="chip ${state.selectedClass === c ? "active" : ""}" onclick="selectClass(${c})">Class ${c}</button>`
  ).join("");

  document.getElementById("groupBar").innerHTML = GROUPS.map(g =>
    `<button class="chip ${state.selectedGroup === g ? "active" : ""}" onclick="selectGroup('${g}')">${g}</button>`
  ).join("");

  const pill = document.getElementById("statusPill");
  if (state.selectedClass && state.selectedGroup) {
    pill.textContent = `Class ${state.selectedClass} · ${state.selectedGroup}`;
  } else {
    pill.textContent = "সিলেক্ট করা হয়নি";
  }
}

function render() {
  renderHeaderBars();
  const app = document.getElementById("app");

  if (!state.selectedClass || !state.selectedGroup) {
    app.innerHTML = `
      <div class="card">
        <h2>শুরু করতে Class ও Group বেছে নাও</h2>
        <p style="margin-top:8px; color:#4b5852; font-size:14px; line-height:1.6;">
          শুরুতে কোনো Class বা Group আগে থেকে সিলেক্ট করা নেই। উপরে নিজের Class (6–12) এবং Group (Science, Arts / Humanities, Commerce) সিলেক্ট করো।
        </p>
      </div>`;
    return;
  }

  const subjects = getSubjectsForSelection();
  if (!state.selectedSubject && subjects.length > 0) {
    state.selectedSubject = subjects[0];
  }

  if (state.tab === "study") {
    const activeSubj = state.selectedSubject;
    const pages = getMaterialPages(activeSubj, state.mode);
    const current = pages[state.pageIdx] || pages[0];

    app.innerHTML = `
      <div class="card">
        <div class="row">
          <div>
            <h3>বিষয় নির্বাচন করো</h3>
            <small style="color:#586660;">Class ${state.selectedClass} · ${state.selectedGroup}</small>
          </div>
          <button class="btn" onclick="downloadPDF('${activeSubj.replace(/'/g, "\\'")}', '${state.mode}', getMaterialPages('${activeSubj.replace(/'/g, "\\'")}', '${state.mode}'))">Download PDF</button>
        </div>

        ${subjects.map(s => `
          <div class="subj-card ${s === activeSubj ? "selected" : ""}" onclick="selectSubject('${s.replace(/'/g, "\\'")}')">
            <div>
              <strong>${s}</strong>
              <small>Books · Guides · Supplements · Test Papers</small>
            </div>
            <button class="btn secondary" onclick="event.stopPropagation(); selectSubject('${s.replace(/'/g, "\\'")}')">
              ${s === activeSubj ? "খোলা আছে" : "পড়ো"}
            </button>
          </div>
        `).join("")}
      </div>

      <div class="card">
        <h3>${activeSubj}</h3>
        <div class="mode-bar">
          ${MODES.map(m => `
            <button class="mode-btn ${state.mode === m.key ? "active" : ""}" onclick="selectMode('${m.key}')">${m.label}</button>
          `).join("")}
        </div>

        <div class="reader-box">
          <h3>${current.title}</h3>
          <p>${current.body}</p>
          <ul>
            ${current.points.map(pt => `<li>${pt}</li>`).join("")}
          </ul>
        </div>

        <div class="page-nav">
          <button class="btn secondary" ${state.pageIdx === 0 ? "disabled" : ""} onclick="state.pageIdx--; render();">← আগের অধ্যায়</button>
          <span>${state.pageIdx + 1} / ${pages.length}</span>
          <button class="btn secondary" ${state.pageIdx >= pages.length - 1 ? "disabled" : ""} onclick="state.pageIdx++; render();">পরের অধ্যায় →</button>
        </div>
      </div>`;
    return;
  }

  if (state.tab === "timer") {
    const total = Object.values(state.times).reduce((a, b) => a + b, 0) + state.timerSec;
    app.innerHTML = `
      <div class="card">
        <small style="color:#586660;">মোট পড়ার সময়</small>
        <div class="big-time">${formatSec(total)}</div>
        ${subjects.map(s => {
          const running = state.runningSubject === s;
          const sec = (state.times[s] || 0) + (running ? state.timerSec : 0);
          return `
            <div class="list-item">
              <div>
                <strong>${s}</strong><br>
                <small style="color:#586660;">${formatSec(sec)}</small>
              </div>
              <button class="btn ${running ? "secondary" : ""}" onclick="toggleTimer('${s.replace(/'/g, "\\'")}')">
                ${running ? "Stop & Save" : "Start"}
              </button>
            </div>`;
        }).join("")}
      </div>`;
    return;
  }

  if (state.tab === "notes") {
    const subj = state.selectedSubject || subjects[0];
    app.innerHTML = `
      <div class="card">
        <h3>স্টাডি নোটস</h3>
        <small style="color:#586660;">বিষয় বেছে নোট লিখে রাখো</small>
        <div class="selectors" style="margin-bottom:8px;">
          ${subjects.map(s => `
            <button class="chip ${s === subj ? "active" : ""}" style="color:${s === subj ? "#0f6b53" : "#16201c"}; border-color:#c6d4ce; background:${s === subj ? "#e3f1ec" : "#fff"};" onclick="selectSubject('${s.replace(/'/g, "\\'")}')">${s}</button>
          `).join("")}
        </div>
        <strong>${subj} নোট</strong>
        <textarea placeholder="${subj} এর গুরুত্বপূর্ণ পয়েন্ট বা সূত্র এখানে লেখো..." oninput="saveNote('${subj.replace(/'/g, "\\'")}', this.value)">${state.notes[subj] || ""}</textarea>
      </div>`;
  }
}

render();
</script>
